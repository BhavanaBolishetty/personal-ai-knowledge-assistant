# Render Blueprint — creates both services in one step via "New +" ->
# "Blueprint" in the Render dashboard, pointed at this repo.
# Secrets (sync: false) are NOT stored here; Render prompts for them once
# in its dashboard and keeps them out of git.
services:
  - type: web
    name: paika-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        sync: false # set to the frontend's live URL, e.g. https://paika-frontend.onrender.com
      - key: DATABASE_URL
        sync: false # Neon connection string
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Gemini's remote embedding API instead of the local
      # sentence-transformers/torch model — the local model's ~370MB
      # resident memory doesn't fit the free plan's 512MB limit (confirmed
      # by direct measurement). Uses the same GEMINI_API_KEY above.
      - key: EMBEDDING_PROVIDER
        value: gemini
      # Calibrated empirically against real production queries — Gemini's
      # embedding space has a measurably higher baseline similarity floor
      # than the local MiniLM model, so reusing the local threshold let
      # clearly off-topic content pass the relevance filter (see the
      # comment in app/core/config.py).
      - key: GEMINI_MIN_RELEVANCE_SCORE
        value: "0.55"
      # Render exposes every service env var as a Docker build arg of the
      # same name (see Dockerfile) — this skips installing
      # sentence-transformers/torch in the image entirely, since
      # EMBEDDING_PROVIDER=gemini never imports them at runtime.
      - key: INSTALL_LOCAL_EMBEDDINGS
        value: "false"

  - type: web
    name: paika-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the backend's live URL, e.g. https://paika-backend.onrender.com
    routes:
      # Client-side routing fallback (this app is a single-page app).
      - type: rewrite
        source: /*
        destination: /index.html
